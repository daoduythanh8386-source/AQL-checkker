name: Build bo cai (Windows + Android)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chuan bi ma nguon app
        shell: bash
        run: |
          mkdir -p electron/app
          cp -r web/. electron/app/
          rm -f electron/app/sw.js
      - name: Build file cai Windows
        working-directory: electron
        shell: bash
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AQL-tra-cuu-windows
          path: |
            electron/dist/*.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Tao project Android tu ban web
        working-directory: android-app
        run: |
          mkdir -p www
          cp -r ../web/. www/
          npm install
          npx cap add android
          npx cap sync android
      - name: Thay icon bang icon Oristar 3D
        working-directory: android-app
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../icons/android/mipmap-$d/ic_launcher.png       $RES/mipmap-$d/ic_launcher.png
            cp ../icons/android/mipmap-$d/ic_launcher_round.png $RES/mipmap-$d/ic_launcher_round.png
          done
      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Doi ten file APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk AQL-tra-cuu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AQL-tra-cuu-android
          path: AQL-tra-cuu.apk
          if-no-files-found: error

  release:
    name: Dang len trang Releases
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.apk
